name: Umami README Screenshot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Create/check/close a test PR without merging"
        type: boolean
        default: true
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: umami-snapshot-writer
  cancel-in-progress: false

jobs:
  update-readme-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    if: >-
      github.repository == 'Jasper-hsury/Jam_Tracks_Hub' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run &&
        github.ref == 'refs/heads/fix/umami-readme-automerge-v1'))

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Create repository-only App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.UMAMI_SNAPSHOT_APP_ID }}
          private-key: ${{ secrets.UMAMI_SNAPSHOT_APP_PRIVATE_KEY }}
          owner: Jasper-hsury
          repositories: Jam_Tracks_Hub
          permission-contents: write
          permission-pull-requests: write

      - name: Validate and publish protected snapshot PR
        env:
          UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL || vars.UMAMI_SHARE_URL }}
          UMAMI_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          UMAMI_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          UMAMI_READ_TOKEN: ${{ github.token }}
          UMAMI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node tools/scripts/umami-snapshot-automation.js
